[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-graphs"
dynamic = ["version"]
description = "Quantum graphs of photonic waveguide networks: spectra, scattering, resonances, classical dynamics and periodic orbits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hugo Girin" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "numdifftools>=0.9",
]
keywords = ["quantum graphs", "quantum chaos", "photonics", "random matrix theory",
            "scattering matrix", "periodic orbits"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/gogofeefee/quantum-graphs"

[tool.setuptools.dynamic]
version = { attr = "quantum_graphs.__version__" }

[tool.setuptools.packages.find]
include = ["quantum_graphs*"]

[tool.setuptools.package-data]
"quantum_graphs.stats" = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long scientific validation (run with -m slow)"]
addopts = "-m 'not slow'"
filterwarnings = ["ignore:FigureCanvasAgg is non-interactive:UserWarning"]

# Lint only (no formatter): real errors and silent-bug patterns.
[tool.ruff.lint]
select = ["F", "B", "NPY", "E9", "PLE"]

# Static checks, also used by the editor / Claude Code LSP. The package is built from
# mixins, so attribute checks are switched off inside it but kept for scripts using the API.
[tool.pyright]
typeCheckingMode = "basic"
include = ["quantum_graphs", "examples", "tests", "docs"]
reportArgumentType = "none"
reportOptionalMemberAccess = "none"
executionEnvironments = [
    { root = "quantum_graphs", extraPaths = ["."], reportAttributeAccessIssue = "none" },
    { root = "." },
]
